server:
  port: 8108

spring:
  application:
    name: examforge-resource
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/examforge_resource?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:examforge}
    password: ${MYSQL_PASSWORD:examforge123}
  cloud:
    openfeign:
      client:
        config:
          examforge-trade:
            url: ${TRADE_URL:http://localhost:8105}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

examforge:
  resource:
    share-pct: 50   # 创作者分成比例%（docs/26 §6，运营可配）

# G3 可观测性（docs/19 §5）：Prometheus 指标暴露（/actuator/prometheus，仅内网可达，不经网关路由）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
