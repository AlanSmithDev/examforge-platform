server:
  port: 8105

spring:
  application:
    name: examforge-trade
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/examforge_trade?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:examforge}
    password: ${MYSQL_PASSWORD:examforge123}
  # 下载计费参数（docs/14 §3 P-3 / §6 D-1）
  examforge:
    free-downloads-per-day: 3
  cloud:
    openfeign:
      client:
        config:
          examforge-school:
            url: ${SCHOOL_URL:http://localhost:8109}   # T-26h 学校权益联动（不可用时 entitlement 降级）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

examforge:
  payment:
    provider: MOCK          # MOCK 沙箱 / WECHAT / ALIPAY（生产切渠道，商户凭证全部 env 注入，不入库不入 git）
    wechat:                 # 微信支付 Native 扫码（官方 wechatpay-java V3，平台证书自动更新）
      merchant-id: ${WX_MCHID:}
      merchant-serial-no: ${WX_SERIAL_NO:}
      api-v3-key: ${WX_APIV3_KEY:}
      private-key-path: ${WX_PRIVATE_KEY_PATH:}
      app-id: ${WX_APPID:}
      notify-url: ${WX_NOTIFY_URL:}
    alipay:                 # 支付宝电脑网站支付（官方 alipay-sdk-java，RSA2 公钥模式）
      app-id: ${ALI_APPID:}
      private-key: ${ALI_PRIVATE_KEY:}
      alipay-public-key: ${ALI_PUBLIC_KEY:}
      gateway: ${ALI_GATEWAY:https://openapi.alipay.com/gateway}
      notify-url: ${ALI_NOTIFY_URL:}

# G3 可观测性（docs/19 §5）：Prometheus 指标暴露（/actuator/prometheus，仅内网可达，不经网关路由）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
