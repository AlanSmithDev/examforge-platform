# G3 监控抓取配置（docs/19 §5）：全部 examforge 服务经 /actuator/prometheus 暴露指标
# 目标以 compose 服务名寻址（prometheus 与业务服务同网络）；本机直跑时请自行替换为 localhost
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: examforge-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']

  - job_name: examforge-user
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user:8101']

  - job_name: examforge-question
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['question:8102']

  - job_name: examforge-paper
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['paper:8103']

  - job_name: examforge-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['admin:8104']

  - job_name: examforge-trade
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['trade:8105']

  - job_name: examforge-practice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['practice:8106']

  - job_name: examforge-ai
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ai:8107']

  - job_name: examforge-resource
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['resource:8108']

  - job_name: examforge-school
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['school:8109']
