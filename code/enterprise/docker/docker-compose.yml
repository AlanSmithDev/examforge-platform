version: "3.9"

# 智卷云全栈编排：数据层（MySQL/Redis/ES）+ 5 个微服务
# 启动：docker compose up -d   健康检查：curl http://localhost:8080/api/v1/health

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_USER: examforge
      MYSQL_PASSWORD: examforge123
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]

  gateway:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-gateway } }
    environment: [ JWT_SECRET=${JWT_SECRET:-examforge-dev-secret-change-in-prod-0123456789abcdef} ]
    ports: ["8080:8080"]
    depends_on: [ user, question, paper, admin ]

  user:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-user } }
    environment: &dbenv
      MYSQL_HOST: mysql
      MYSQL_USER: examforge
      MYSQL_PASSWORD: examforge123
      JWT_SECRET: ${JWT_SECRET:-examforge-dev-secret-change-in-prod-0123456789abcdef}
    depends_on:
      mysql: { condition: service_healthy }

  question:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-question } }
    environment:
      <<: *dbenv
      # G2 分表开关：先执行 sql/13_sharding.sql（建分表+迁移+对账+RENAME），
      # 再设 QUESTION_PROFILE=sharding 并重启本服务（docs/27 §9.2；默认空=单表，CI/开发零影响）
      SPRING_PROFILES_ACTIVE: ${QUESTION_PROFILE:-}
    depends_on:
      mysql: { condition: service_healthy }

  paper:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-paper } }
    environment:
      <<: *dbenv
      QUESTION_URL: http://question:8102
      RENDER_URL: http://render:3000        # browserless：HTML→PDF 渲染管线（docs/03 render-svc）
    depends_on:
      mysql: { condition: service_healthy }

  # HTML→PDF 渲染管线（browserless 提供 /pdf API）
  render:
    image: ghcr.io/browserless/chromium:latest
    environment: { TIMEOUT: "30000", CONCURRENT: "4" }
    ports: ["3100:3000"]

  admin:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-admin } }
    environment: *dbenv
    depends_on:
      mysql: { condition: service_healthy }

  trade:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-trade } }
    environment: *dbenv
    depends_on:
      mysql: { condition: service_healthy }

  practice:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-practice } }
    environment:
      <<: *dbenv
      QUESTION_URL: http://question:8102
      PAPER_URL: http://paper:8103
    depends_on:
      mysql: { condition: service_healthy }

  ai:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-ai } }
    environment:
      <<: *dbenv
      AI_PROVIDER: ${AI_PROVIDER:-MOCK}
      AI_API_KEY: ${AI_API_KEY:-}
    depends_on:
      mysql: { condition: service_healthy }

  resource:
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODULE: examforge-resource } }
    environment:
      <<: *dbenv
      TRADE_URL: http://trade:8105
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  mysql-data:
  redis-data:
  es-data:
