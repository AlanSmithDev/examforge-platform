<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 搜与助手 - 智卷云</title>
<link rel="stylesheet" href="assets/style.css">
<script defer src="assets/katex-loader.js"></script>
<style>
  .tabs { display:flex; gap:8px; margin:18px 0 14px; flex-wrap:wrap; }
  .tabs button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 18px; cursor:pointer; font-size:14px; }
  .tabs button.on { background:var(--primary); color:#fff; border-color:var(--primary); }
  .search-bar { display:flex; gap:10px; margin-bottom:16px; }
  .search-bar input { flex:1; border:1px solid var(--line); border-radius:12px; padding:12px 16px; font-size:15px; }
  .q-card { background:#fff; border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); margin-bottom:12px; }
  .q-meta { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--text-3); margin-bottom:6px; }
  .q-meta .tag { background:#eef2ff; color:var(--primary); border-radius:999px; padding:1px 10px; font-weight:600; }
  .q-stem { font-size:14px; line-height:1.7; }
  .ai-box { background:linear-gradient(135deg,#eef2ff,#e0e7ff); border-radius:14px; padding:18px 22px; white-space:pre-wrap; font-size:14px; line-height:1.9; }
  .quota-line { font-size:12.5px; color:var(--text-3); margin-bottom:14px; }
  .draft-note { background:#fffbeb; border:1px dashed #f59e0b; border-radius:10px; padding:8px 12px; font-size:12.5px; color:#92400e; margin-top:10px; }
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="index.html"><span class="mark">智</span><span><em>智卷云</em></span></a>
  <div class="links">
    <a href="index.html">首页</a><a href="xuanti.html">章节选题</a><a href="zhineng.html">智能组卷</a>
    <a href="mine.html">个人题库</a><a class="active" href="sousoti.html">AI 搜</a><a href="vip.html">会员</a>
  </div>
  <div class="spacer"></div>
  <a class="btn btn-ghost" href="vip.html" id="userBox">登录 / 注册</a>
  <a class="btn btn-primary" href="zhineng.html">去组卷</a>
</nav>

<section class="section" style="padding-top:14px;max-width:900px">
  <div class="section-head" style="margin-bottom:0">
    <h2>AI 搜 · 智能助手</h2>
    <p>搜题 / AI 变式出题 / AI 分步讲题 —— AI 生成内容全部人工审核后才入库（MOCK 通道演示，可配 OPENAI_COMPAT 实连）</p>
  </div>

  <div class="tabs" id="modeTabs">
    <button class="on" data-m="search">🔍 文字搜题</button>
    <button data-m="variants">🤖 AI 变式出题</button>
    <button data-m="explain">🎓 AI 分步讲题</button>
    <button data-m="paper">📄 试卷名搜索</button>
    <button data-m="photo">📷 拍照搜题（即将上线）</button>
  </div>

  <div class="quota-line" id="quotaLine">配额加载中…</div>

  <div class="search-bar">
    <input id="kw" placeholder="输入题干关键词 / 题目 ID 对应内容 / 试卷名（按模式变化）">
    <button class="btn btn-primary" id="goBtn" onclick="run()">搜索</button>
  </div>

  <div id="result"><p class="muted">输入关键词开始（文字搜题免登录，AI 功能需登录）</p></div>
</section>

<div class="toast" id="toast"></div>
<footer class="footer" style="margin-top:20px"><p><b>智卷云</b> · AI 搜（接口：GET /questions、POST /ai/variants、/ai/explain、GET /ai/quota，docs/17 §7C）</p></footer>

<script src="assets/katex-loader.js"></script>
<script>
const API = location.protocol.startsWith('http') ? '/api/v1' : 'http://localhost:3000/api/v1';
const TOKEN = localStorage.getItem('zj_token') || '';
const AUTH = TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {};
let MODE = 'search';

function toast(m){const t=document.getElementById('toast');t.textContent=(m.startsWith('⚠')?'':'✅ ')+m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2800);}
function renderMath(scope){ if (typeof window.renderMathInElement === 'function') { try { window.renderMathInElement(scope||document.body,{delimiters:[{left:'\\(',right:'\\)',display:false}]}); } catch(_){} } }
const stars = d => '★'.repeat(d) + '☆'.repeat(5 - d);
async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', ...AUTH, ...(opts.headers || {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({ code: 50010, message: '响应异常' }));
  if (j.code !== 0) { const e = new Error(j.message); e.code = j.code; e.data = j.data; throw e; }
  return j.data;
}

const PLACEHOLDER = {
  search: '输入题干关键词，如：双曲线 离心率',
  variants: '粘贴题干（或搜题后点题目上的 AI 出题），生成保持考点/难度的变式草稿',
  explain: '粘贴题干，或先「文字搜题」再对题目讲题',
  paper: '输入试卷名关键词',
  photo: '拍照搜题即将上线（OCR 流水线排期 docs/22 C7）'
};
document.querySelectorAll('#modeTabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#modeTabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  MODE = b.dataset.m;
  document.getElementById('kw').placeholder = PLACEHOLDER[MODE];
  document.getElementById('goBtn').style.display = MODE === 'photo' ? 'none' : '';
  if (MODE === 'variants' || MODE === 'explain') loadQuota();
});

async function loadQuota() {
  if (!TOKEN) { document.getElementById('quotaLine').textContent = '⚠ AI 功能需登录后使用（免费每日 3 次，会员 50 次/日）'; return; }
  try {
    const d = await api('/ai/quota');
    document.getElementById('quotaLine').innerHTML = `今日 AI 配额：<b style="color:var(--primary)">${d.used}/${d.quota}</b>${d.member ? '（会员）' : '（免费档，开通会员升至 50 次/日）'}`;
  } catch (_) {}
}

function qCard(q, withAi) {
  return `<div class="q-card">
    <div class="q-meta"><span class="tag">${q.type}</span><span>难度 ${stars(q.difficulty)}</span><span>使用 ${q.use_count} 次</span></div>
    <div class="q-stem">${q.stem}</div>
    <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
      ${withAi ? `<button class="btn btn-ghost btn-sm" onclick="aiExplain(${q.id})">🎓 AI 讲题</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="aiVariants(${q.id})">🤖 AI 变式</button>
    </div></div>`;
}

async function run() {
  const kw = document.getElementById('kw').value.trim();
  const box = document.getElementById('result');
  if (MODE === 'photo') { box.innerHTML = '<p class="muted">拍照搜题排期中：上传图片 → OCR → 题干匹配（docs/06 §5）</p>'; return; }
  if (!kw) { toast('⚠ 请输入内容'); return; }
  box.innerHTML = '<p class="muted">加载中…</p>';
  try {
    if (MODE === 'search' || MODE === 'paper') {
      const d = await api('/questions?keyword=' + encodeURIComponent(kw) + '&pageSize=10');
      box.innerHTML = d.list.length
        ? d.list.map(q => qCard(q, true)).join('')
        : '<p class="muted">没有找到相关' + (MODE === 'paper' ? '试卷名' : '题目') + '，换个关键词试试</p>';
      renderMath(box);
    } else if (MODE === 'variants') {
      const d = await api('/ai/variants', { method: 'POST', body: { stem: kw } });
      box.innerHTML = `<div class="ai-box">${d.draft.stem}</div>
        <div class="draft-note">AI 生成草稿（aigc=1）：保持原考点与题型，仅替换情境数据。草稿不直接入库，需学科编辑审核后上架。</div>`;
      renderMath(box); loadQuota();
    } else if (MODE === 'explain') {
      const d = await api('/ai/explain', { method: 'POST', body: { stem: kw } });
      box.innerHTML = `<div class="ai-box">${d.steps}</div>${d.degraded ? '<div class="draft-note">AI 服务暂时不可用，已降级 MOCK 演示通道。</div>' : ''}`;
      renderMath(box); loadQuota();
    }
  } catch (e) {
    if (e.code === 40100) { box.innerHTML = '<p class="muted">AI 功能需登录后使用</p>'; }
    else if (e.code === 42900) { box.innerHTML = `<p class="muted">今日 AI 配额已用完（${e.data?.quota?.quota || 3} 次）——开通会员升至 50 次/日：<a class="link-btn" href="vip.html">去会员页</a></p>`; }
    else box.innerHTML = '<p class="muted">失败：' + e.message + '</p>';
  }
}
async function aiExplain(qid) {
  try {
    const d = await api('/ai/explain', { method: 'POST', body: { questionId: qid } });
    document.getElementById('result').insertAdjacentHTML('afterbegin',
      `<div class="ai-box">${d.steps}</div>`);
    renderMath(document.getElementById('result')); loadQuota();
  } catch (e) { if (e.code === 42900) toast('⚠ 今日 AI 配额已用完，开通会员升至 50 次/日'); else toast('⚠ ' + e.message); }
}
async function aiVariants(qid) {
  try {
    const d = await api('/ai/variants', { method: 'POST', body: { questionId: qid } });
    document.getElementById('result').insertAdjacentHTML('afterbegin',
      `<div class="q-card"><div class="q-meta"><span class="tag">AI 变式草稿</span><span>题目 #${qid} 同源</span></div>
       <div class="q-stem">${d.draft.stem}</div>
       <div class="draft-note">AI 生成（aigc=1）待人工审核，通过后进入题库并通知你。</div></div>`);
    renderMath(document.getElementById('result')); loadQuota();
  } catch (e) { if (e.code === 42900) toast('⚠ 今日 AI 配额已用完'); else toast('⚠ ' + e.message); }
}

document.getElementById('kw').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
(async function boot() {
  if (TOKEN) { try { const me = await api('/member/me'); document.getElementById('userBox').textContent = me.member.active ? '👑 会员用户' : '👤 已登录'; } catch (_) {} }
  loadQuota();
})();
</script>
</body>
</html>
